name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for npm trusted publishing (OIDC) - see CLAUDE.md's "Whole-repo npm publish" entry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, including .git)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: |
          npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
          npm pkg set version="${GITHUB_REF_NAME#v}" # tag is the single source of truth for the published version, not the committed package.json
          npm publish --access public

      - name: Build zip with .git included
        run: |
          repo="${GITHUB_REPOSITORY##*/}"
          tag="${GITHUB_REF_NAME}"
          out="${repo}-${tag}-with-git.zip"
          zip -r "$out" . -x "$out"
          echo "ASSET_PATH=$out" >> "$GITHUB_ENV"
          echo "ASSET_NAME=$out" >> "$GITHUB_ENV"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
